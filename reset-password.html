<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Set a new password - RejoiceFutureBank</title>
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body class="auth-page">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <div class="logo">
            <span class="logo-icon">🏦</span>
            <span class="logo-text">RejoiceFutureBank</span>
          </div>
          <h2>Set a new password</h2>
        </div>

        <form id="resetForm" class="auth-form">
          <div class="form-group">
            <label for="newPassword">New password</label>
            <input type="password" id="newPassword" required minlength="8" />
          </div>
          <div class="form-group">
            <label for="confirmPassword">Confirm new password</label>
            <input type="password" id="confirmPassword" required minlength="8" />
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="resetBtn">Update password</button>
        </form>

        <div id="resetResult" class="alert" style="display:none"></div>
        <div class="auth-footer"><p><a href="login.html">Back to sign in</a></p></div>
      </div>
    </div>

    <script src="./JAVASCRIPT/api.js"></script>
    <script>
      const token = new URLSearchParams(window.location.search).get('token');
      const resultDiv = document.getElementById('resetResult');

      if (!token) {
        resultDiv.className = 'alert alert-error';
        resultDiv.textContent = 'This reset link is invalid. Please request a new one.';
        resultDiv.style.display = 'block';
        document.getElementById('resetForm').style.display = 'none';
      }

      document.getElementById('resetForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (newPassword !== confirmPassword) {
          resultDiv.className = 'alert alert-error';
          resultDiv.textContent = 'Passwords do not match.';
          resultDiv.style.display = 'block';
          return;
        }

        const btn = document.getElementById('resetBtn');
        btn.disabled = true;
        btn.textContent = 'Updating...';

        try {
          const response = await API.resetPassword(token, newPassword);
          resultDiv.className = 'alert alert-success';
          resultDiv.textContent = response.message + ' Redirecting to sign in...';
          resultDiv.style.display = 'block';
          setTimeout(() => window.location.href = '/login.html', 2000);
        } catch (error) {
          resultDiv.className = 'alert alert-error';
          resultDiv.textContent = error.message;
          resultDiv.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Update password';
        }
      });
    </script>
  </body>
</html>
