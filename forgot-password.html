<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Reset your password - RejoiceFutureBank</title>
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body class="auth-page">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <div class="logo">
            <span class="logo-icon">🏦</span>
            <span class="logo-text">RejoiceFutureBank</span>
          </div>
          <h2>Reset your password</h2>
          <p>Enter the email on your account and we'll send you a reset link.</p>
        </div>

        <form id="forgotForm" class="auth-form">
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" required placeholder="you@example.com" />
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="forgotBtn">Send reset link</button>
        </form>

        <div id="forgotResult" class="alert alert-info" style="display:none"></div>

        <div class="auth-footer"><p><a href="login.html">Back to sign in</a></p></div>
      </div>
    </div>

    <script src="./JAVASCRIPT/api.js"></script>
    <script>
      document.getElementById('forgotForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('forgotBtn');
        const resultDiv = document.getElementById('forgotResult');
        btn.disabled = true;
        btn.textContent = 'Sending...';
        try {
          const response = await API.forgotPassword(document.getElementById('email').value);
          resultDiv.textContent = response.message;
          resultDiv.style.display = 'block';
        } catch (error) {
          resultDiv.textContent = 'Something went wrong. Please try again.';
          resultDiv.style.display = 'block';
        } finally {
          btn.disabled = false;
          btn.textContent = 'Send reset link';
        }
      });
    </script>
  </body>
</html>
